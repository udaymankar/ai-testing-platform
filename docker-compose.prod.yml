services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitesting}
      POSTGRES_USER: ${POSTGRES_USER:-aitesting_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitesting_app} -d ${POSTGRES_DB:-aitesting}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data

  selenium:
    image: selenium/standalone-chrome:4.48.0-20260905
    restart: unless-stopped
    shm_size: 2gb
    environment:
      SE_START_VNC: "false"
      SE_NODE_MAX_SESSIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q 'ready'"]
      interval: 15s
      timeout: 8s
      retries: 20
    networks:
      - browser

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aitesting}
      DATABASE_USERNAME: ${POSTGRES_USER:-aitesting_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      SELENIUM_REMOTE_URL: http://selenium:4444
      BROWSER_TIMEOUT_SECONDS: ${BROWSER_TIMEOUT_SECONDS:-20}
      MAX_TESTS_PER_RUN: ${MAX_TESTS_PER_RUN:-10}
      ARTIFACTS_DIR: /app/artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FRONTEND_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      selenium:
        condition: service_healthy
    networks:
      - public
      - data
      - browser

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    networks:
      - public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - public

networks:
  public:
  data:
    internal: true
  browser:

volumes:
  postgres_data:
  artifacts:
  caddy_data:
  caddy_config:
